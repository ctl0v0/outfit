name: Public search pack

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-search-pack
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'ctl0v0/outfit'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test builder and publication gates
        run: python -m unittest tests.test_search_pack_builder
      - name: Restore public-only license evidence
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/outfit-pack-public-state
          key: search-pack-public-v1-${{ hashFiles('scripts/build_search_pack.py', 'scripts/outfit.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            search-pack-public-v1-${{ hashFiles('scripts/build_search_pack.py', 'scripts/outfit.py') }}-
      - name: Build from current official public catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/build_search_pack.py
          --output "${{ runner.temp }}/outfit-pack"
          --state-dir "${{ runner.temp }}/outfit-pack-public-state"
          --previous-public
      - name: Save public-only progress even after API budget exhaustion
        if: always() && !cancelled()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/outfit-pack-public-state
          key: search-pack-public-v1-${{ hashFiles('scripts/build_search_pack.py', 'scripts/outfit.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Revalidate complete corpus and source provenance
        run: python scripts/build_search_pack.py --validate "${{ runner.temp }}/outfit-pack" --require-publishable
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-search-pack
          path: |
            ${{ runner.temp }}/outfit-pack/latest.json
            ${{ runner.temp }}/outfit-pack/catalog.json
            ${{ runner.temp }}/outfit-pack/*.jsonl.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-search-pack
          path: ${{ runner.temp }}/outfit-pack
      - name: Verify artifact before obtaining publication credentials
        run: python scripts/build_search_pack.py --validate "${{ runner.temp }}/outfit-pack" --require-publishable
      - name: Publish immutable assets, verify public bytes, then promote manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/build_search_pack.py --publish "${{ runner.temp }}/outfit-pack"
