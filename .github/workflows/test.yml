name: Test

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: ./tests/run --python-only

  portable:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      # The UI uses Qt >=6.8 (including Popup.Item); Ubuntu's Qt 6.4 is too old.
      # Exercise the rolling Arch stack used by the supported Omarchy desktop.
      - name: Install current Arch test dependencies
        run: pacman -Syu --noconfirm --needed git python qt6-declarative qt6-multimedia qt6-svg ttf-dejavu ffmpeg
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: ./tests/run
